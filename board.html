<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSI Next BM School · Board</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="/firebase-config.js"></script>
<script src="/constants.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
* { font-family: 'Inter', system-ui, sans-serif; box-sizing: border-box; margin:0; padding:0; }
body { background: #0a0f1e; color: #e2e8f0; min-height: 100vh; overflow-x: hidden; }

/* ── Glow Effects ── */
.glow-teal  { box-shadow: 0 0 20px rgba(0,163,157,0.25); }
.glow-gold  { box-shadow: 0 0 20px rgba(248,173,60,0.25); }

/* ── Card glass ── */
.glass { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; }

/* ── BPM bar ── */
.bpm-bar-track { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
.bpm-bar-fill  { height: 100%; border-radius: 3px; transition: width 0.6s cubic-bezier(.4,0,.2,1); }

/* ── Rank badge ── */
.rank-1 { background: linear-gradient(135deg, #F8AD3C, #e8960a); color: #1a0f00; }
.rank-2 { background: linear-gradient(135deg, #9ca3af, #6b7280); color: #fff; }
.rank-3 { background: linear-gradient(135deg, #cd7f32, #a0522d); color: #fff; }
.rank-other { background: rgba(255,255,255,0.08); color: #94a3b8; }

/* ── Slide-in animation ── */
@keyframes slideUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
.slide-up { animation: slideUp 0.4s ease forwards; }

/* ── Pulse ── */
@keyframes glow-pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
.live-dot { animation: glow-pulse 1.5s infinite; }

/* ── Number counter ── */
.counter-val { transition: all 0.5s; }

/* ── Connection ── */
.conn-on  { background:#10b981; animation: glow-pulse 2s infinite; }
.conn-off { background:#ef4444; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius:2px; }
</style>
</head>
<body class="p-4 md:p-6">

<!-- ══════════════════════════════════════════════════════════════ HEADER -->
<header class="flex items-center justify-between mb-6">
  <div class="flex items-center gap-4">
    <div>
      <h1 class="text-xl font-bold text-white">BSI Next BM School</h1>
      <p class="text-xs text-slate-400 mt-0.5">Branch Banking Simulation · Scoreboard</p>
    </div>
  </div>
  <div class="flex items-center gap-4">
    <!-- Phase pill -->
    <div class="flex items-center gap-2 px-3 py-1.5 rounded-full glass">
      <div class="w-2 h-2 rounded-full live-dot" id="connDot" style="background:#ef4444"></div>
      <span class="text-xs font-medium text-slate-300" id="phaseLabel">Menghubungkan...</span>
    </div>
    <!-- Round indicator -->
    <div class="flex gap-1" id="roundPips">
      <!-- injected -->
    </div>
    <!-- Sync -->
    <span class="text-xs text-slate-600" id="syncTime">—</span>
  </div>
</header>

<!-- ══════════════════════════════════════════════════════════════ BROADCAST MSG -->
<div id="broadcastBar" class="hidden mb-4 px-4 py-3 rounded-xl text-sm font-medium text-bsi-dark"
     style="background:#F8AD3C;color:#1a0f00"></div>

<!-- ══════════════════════════════════════════════════════════════ ROUND TABS -->
<div class="flex gap-2 mb-5" id="roundTabsBoard">
  <!-- injected by JS -->
</div>

<!-- ══════════════════════════════════════════════════════════════ LEADERBOARD -->
<div class="grid gap-3" id="leaderboard">
  <!-- injected by JS -->
</div>

<!-- ══════════════════════════════════════════════════════════════ BOTTOM ROW -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">

  <!-- Amanah Points Tracker -->
  <div class="glass p-4 md:col-span-1">
    <div class="text-xs font-semibold text-slate-400 tracking-widest uppercase mb-3">Koin Amanah Kumulatif</div>
    <div class="space-y-3" id="amanahPanel">
      <!-- injected -->
    </div>
  </div>

  <!-- Submission Status -->
  <div class="glass p-4 md:col-span-2">
    <div class="text-xs font-semibold text-slate-400 tracking-widest uppercase mb-3">Status Submisi · <span id="statusRoundLabel">—</span></div>
    <div class="space-y-2.5" id="statusPanel">
      <!-- injected -->
    </div>
  </div>

</div>

<!-- ══════════════════════════════════════════════════════════════ FOOTER -->
<footer class="mt-6 text-center text-xs text-slate-700">
  BSI Corporate University · HCR.ID · Next BM School 2026 · Data diperbarui secara langsung
</footer>

<script>
// ── State ───────────────────────────────────────────────────────────────────
let scoresCache  = {};
let sessionData  = {};
let groupsCache  = {};
let selectedRound = 'r1';

const PHASES_MAP = {
  'lobby':'Lobby', 'r1_brief':'R1 Briefing', 'r1_run':'R1 Berjalan',
  'r1_score':'R1 Skoring', 'r1_debrief':'R1 Debrief',
  'r2_brief':'R2 Briefing', 'r2_run':'R2 Berjalan',
  'r2_score':'R2 Skoring', 'r2_debrief':'R2 Debrief',
  'r3_brief':'R3 Briefing', 'r3_run':'R3 Berjalan',
  'r3_score':'R3 Skoring', 'r3_debrief':'R3 Debrief',
  'r4_brief':'R4 Briefing', 'r4_run':'R4 Berjalan',
  'r4_score':'R4 Skoring', 'r4_debrief':'R4 Debrief',
  'post':'Post-Test', 'ended':'Sesi Selesai'
};

// ── Boot ────────────────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  const sess = getSession();
  if (!sess.role || sess.role !== 'board') {
    window.location.href = '/index.html'; return;
  }
  initUI();
  attachFirestoreListeners();
});

function initUI() {
  renderRoundTabs();
  renderRoundPips();
}

// ── Firestore Listeners ─────────────────────────────────────────────────────
function attachFirestoreListeners() {
  // Session
  db.collection('session').doc('current')
    .onSnapshot(snap => {
      if (snap.exists) {
        sessionData = snap.data();
        updatePhaseUI();
        // Auto-switch round based on phase
        const phase = sessionData.phase || 'lobby';
        const match = phase.match(/^r([1-4])/);
        if (match) selectedRound = `r${match[1]}`;
        renderRoundTabs();
      }
    }, err => { console.error('[Session]', err); setConnected(false); });

  // ─── CRITICAL FIX: collection-level listener (not document-level) ───────
  // This is what was broken in v1: Board was not receiving GM updates
  db.collection('scores')
    .onSnapshot(snapshot => {
      snapshot.docChanges().forEach(change => {
        scoresCache[change.doc.id] = change.doc.data();
      });
      renderAll();
      setConnected(true);
      updateSyncTime();
    }, err => {
      console.error('[Scores onSnapshot]', err);
      setConnected(false);
    });

  // Groups
  db.collection('groups')
    .onSnapshot(snap => {
      snap.forEach(doc => { groupsCache[doc.id] = doc.data(); });
    }, err => console.error('[Groups]', err));
}

// ── Render All ──────────────────────────────────────────────────────────────
function renderAll() {
  renderLeaderboard();
  renderAmanahPanel();
  renderStatusPanel();
}

// ── Leaderboard ─────────────────────────────────────────────────────────────
function renderLeaderboard() {
  // Gather data for selected round
  const entries = GROUP_IDS.map(gid => {
    const docId = scoreDocId(gid, selectedRound);
    const doc   = scoresCache[docId] || {};
    const g     = GROUPS[gid];
    return {
      groupId:     gid,
      name:        g.name,
      color:       g.color,
      textColor:   g.textColor,
      deltaCM:     doc.gm_deltaCM || 0,
      bpmAgg:      doc.bpm_aggregate || 0,
      bpmNorm:     doc.bpm_normalized || 50,
      bpmCM:       doc.gm_bpm?.cm || 0,
      bpmRisk:     doc.gm_bpm?.risk || 0,
      bpmPeople:   doc.gm_bpm?.people || 0,
      bpmCS:       doc.gm_bpm?.cs || 0,
      amanah:      doc.gm_amanah || 0,
      l3Avg:       doc.l3_group_avg || 0,
      gmDone:      doc.gm_submitted || false,
      leadDone:    doc.leader_submitted || false,
      coachDone:   doc.coach_submitted || false,
      groupScore:  doc.group_score || 0,
    };
  });

  // Compute normalized group scores
  const scored = computeGroupScores(entries.map(e => ({
    ...e, gm_deltaCM: e.deltaCM, bpm_normalized: e.bpmNorm
  })));

  // Sort by group_score desc
  const sorted = scored
    .map((s, i) => ({ ...entries[i], groupScore: s.group_score }))
    .sort((a, b) => b.groupScore - a.groupScore);

  const container = document.getElementById('leaderboard');
  const r = ROUNDS[selectedRound];
  const maxAbs = Math.max(...entries.map(e => Math.abs(e.deltaCM)), 1);

  container.innerHTML = sorted.map((entry, rank) => {
    const rankNum = rank + 1;
    const rankClass = rankNum === 1 ? 'rank-1' : rankNum === 2 ? 'rank-2' : rankNum === 3 ? 'rank-3' : 'rank-other';
    const rankLabel = rankNum === 1 ? '🥇' : rankNum === 2 ? '🥈' : rankNum === 3 ? '🥉' : `#${rankNum}`;
    const deltaNorm = (entry.deltaCM / maxAbs + 1) / 2 * 100; // map to 0-100
    const bpmBarW   = entry.bpmNorm;

    const cmColor    = entry.bpmCM    >= 0 ? '#10b981' : '#ef4444';
    const riskColor  = entry.bpmRisk  >= 0 ? '#10b981' : '#ef4444';
    const peopleColor= entry.bpmPeople>= 0 ? '#10b981' : '#ef4444';
    const csColor    = entry.bpmCS    >= 0 ? '#10b981' : '#ef4444';

    return `
    <div class="glass p-4 slide-up" style="animation-delay:${rank*0.05}s;border-left:3px solid ${entry.color}">
      <div class="flex items-start gap-4">

        <!-- Rank Badge -->
        <div class="w-10 h-10 rounded-xl flex items-center justify-center font-bold text-sm flex-shrink-0 ${rankClass}">
          ${rankLabel}
        </div>

        <!-- Group Name + Status -->
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 mb-2">
            <span class="font-bold text-base text-white">${entry.name}</span>
            <div class="flex gap-1">
              ${entry.gmDone    ? '<span class="text-xs px-1.5 py-0.5 rounded bg-green-500/20 text-green-400 font-medium">GM</span>' : '<span class="text-xs px-1.5 py-0.5 rounded bg-white/5 text-slate-600">GM</span>'}
              ${entry.leadDone  ? '<span class="text-xs px-1.5 py-0.5 rounded bg-green-500/20 text-green-400 font-medium">Lead</span>' : '<span class="text-xs px-1.5 py-0.5 rounded bg-white/5 text-slate-600">Lead</span>'}
              ${entry.coachDone ? '<span class="text-xs px-1.5 py-0.5 rounded bg-green-500/20 text-green-400 font-medium">Coach</span>' : '<span class="text-xs px-1.5 py-0.5 rounded bg-white/5 text-slate-600">Coach</span>'}
            </div>
          </div>

          <!-- BPM Indicators Row -->
          <div class="grid grid-cols-4 gap-2 mb-3">
            ${[
              {k:'CM',    val:entry.bpmCM,     color:cmColor,     w:'40%'},
              {k:'Risk',  val:entry.bpmRisk,   color:riskColor,   w:'25%'},
              {k:'People',val:entry.bpmPeople, color:peopleColor, w:'20%'},
              {k:'CS',    val:entry.bpmCS,     color:csColor,     w:'15%'}
            ].map(ind => `
              <div>
                <div class="text-xs text-slate-500 mb-0.5">${ind.k} <span style="color:${ind.color}">${fmtBPM(ind.val)}</span></div>
                <div class="bpm-bar-track">
                  <div class="bpm-bar-fill" style="background:${ind.color};width:${(ind.val+10)/20*100}%"></div>
                </div>
              </div>`).join('')}
          </div>

          <!-- Group Score Bar -->
          <div class="flex items-center gap-2">
            <div class="text-xs text-slate-500 w-20 flex-shrink-0">Skor Gabungan</div>
            <div class="flex-1 bpm-bar-track">
              <div class="bpm-bar-fill" style="background:${entry.color};width:${Math.max(0,entry.groupScore+50)}%"></div>
            </div>
            <div class="text-xs font-bold text-white w-12 text-right">${entry.groupScore.toFixed(1)}</div>
          </div>
        </div>

        <!-- Right: Key Metrics -->
        <div class="text-right flex-shrink-0">
          <div class="text-2xl font-black mb-0.5" style="color:${entry.deltaCM >= 0 ? '#10b981' : '#ef4444'}">
            ${fmtRupiah(entry.deltaCM)}
          </div>
          <div class="text-xs text-slate-500 mb-2">Δ CM Cabang</div>
          <div class="text-sm font-semibold text-bsi-gold">${entry.amanah} 🪙</div>
          <div class="text-xs text-slate-600">Amanah</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── Amanah Panel ─────────────────────────────────────────────────────────────
function renderAmanahPanel() {
  const container = document.getElementById('amanahPanel');

  // Sum amanah across all rounds per group
  const totals = GROUP_IDS.map(gid => {
    let total = 0;
    ROUND_IDS.forEach(rid => {
      total += scoresCache[scoreDocId(gid, rid)]?.gm_amanah || 0;
    });
    return { gid, total };
  }).sort((a, b) => b.total - a.total);

  const maxTotal = Math.max(...totals.map(t => t.total), 1);

  container.innerHTML = totals.map(({ gid, total }) => {
    const g = GROUPS[gid];
    return `
      <div class="flex items-center gap-2">
        <div class="w-2 h-2 rounded-full flex-shrink-0" style="background:${g.color}"></div>
        <span class="text-xs text-slate-300 w-20 flex-shrink-0">${g.name}</span>
        <div class="flex-1 bpm-bar-track">
          <div class="bpm-bar-fill" style="background:${g.color};width:${total/maxTotal*100}%"></div>
        </div>
        <span class="text-xs font-bold text-bsi-gold w-12 text-right">${total} 🪙</span>
      </div>`;
  }).join('');
}

// ── Status Panel ────────────────────────────────────────────────────────────
function renderStatusPanel() {
  const container  = document.getElementById('statusPanel');
  document.getElementById('statusRoundLabel').textContent = `R${ROUNDS[selectedRound].number} ${ROUNDS[selectedRound].title}`;

  container.innerHTML = GROUP_IDS.map(gid => {
    const doc = scoresCache[scoreDocId(gid, selectedRound)] || {};
    const g   = GROUPS[gid];
    const cell = (done, label) => done
      ? `<span class="text-xs px-2 py-1 rounded-lg font-semibold" style="background:${g.color}20;color:${g.color}">${label} ✓</span>`
      : `<span class="text-xs px-2 py-1 rounded-lg font-medium bg-white/5 text-slate-600">${label}</span>`;

    return `
      <div class="flex items-center gap-2">
        <div class="w-2 h-2 rounded-full" style="background:${g.color}"></div>
        <span class="text-sm text-slate-300 w-24">${g.name}</span>
        <div class="flex gap-1.5">
          ${cell(doc.gm_submitted,    'GM')}
          ${cell(doc.leader_submitted,'Leader')}
          ${cell(doc.coach_submitted, 'Coach')}
        </div>
        ${doc.gm_submitted ? `<span class="ml-auto text-xs font-mono text-slate-500">${fmtBPM(doc.bpm_aggregate||0)}</span>` : ''}
      </div>`;
  }).join('');
}

// ── Round Tabs ───────────────────────────────────────────────────────────────
function renderRoundTabs() {
  const container = document.getElementById('roundTabsBoard');
  container.innerHTML = ROUND_IDS.map(rid => {
    const r = ROUNDS[rid];
    const active = rid === selectedRound;
    return `
      <button onclick="switchRound('${rid}')"
        class="px-4 py-2 rounded-xl text-sm font-medium transition"
        style="${active
          ? `background:${GROUPS.borobudur.color};color:#fff`
          : 'background:rgba(255,255,255,0.05);color:#94a3b8'}">
        R${r.number} · ${r.category}
      </button>`;
  }).join('');
}

function renderRoundPips() {
  const container = document.getElementById('roundPips');
  container.innerHTML = ROUND_IDS.map(rid => {
    const active = rid === selectedRound;
    return `<div class="w-2 h-2 rounded-full transition" style="background:${active ? '#00A39D' : 'rgba(255,255,255,0.15)'}"></div>`;
  }).join('');
}

function switchRound(rid) {
  selectedRound = rid;
  renderRoundTabs();
  renderRoundPips();
  renderLeaderboard();
  renderStatusPanel();
}

// ── Phase UI ─────────────────────────────────────────────────────────────────
function updatePhaseUI() {
  const phase = sessionData.phase || 'lobby';
  document.getElementById('phaseLabel').textContent = PHASES_MAP[phase] || phase;

  // Broadcast
  const bar = document.getElementById('broadcastBar');
  if (sessionData.message) {
    bar.textContent = sessionData.message;
    bar.classList.remove('hidden');
    clearTimeout(bar._timer);
    bar._timer = setTimeout(() => bar.classList.add('hidden'), 30000);
  }
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function setConnected(online) {
  const dot = document.getElementById('connDot');
  if (online) { dot.style.background = '#10b981'; dot.classList.add('live-dot'); }
  else        { dot.style.background = '#ef4444'; dot.classList.remove('live-dot'); }
}

function updateSyncTime() {
  document.getElementById('syncTime').textContent = new Date().toLocaleTimeString('id-ID');
}
</script>
</body>
</html>
