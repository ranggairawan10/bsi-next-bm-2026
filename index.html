<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSI Next BM School · Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: {
      'bsi-teal': '#00A39D',
      'bsi-gold': '#F8AD3C',
      'bsi-dark': '#0f1c2e'
    }}}
  }
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  * { font-family: 'Inter', system-ui, sans-serif; }

  body {
    background: linear-gradient(135deg, #0f1c2e 0%, #1a3a5c 50%, #0f2d3a 100%);
    min-height: 100vh;
  }

  .glass-card {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.12);
  }

  .code-input {
    letter-spacing: 0.15em;
    font-size: 1.1rem;
    font-weight: 600;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.15);
    color: #fff;
    caret-color: #F8AD3C;
  }
  .code-input:focus {
    outline: none;
    border-color: #00A39D;
    background: rgba(0,163,157,0.1);
    box-shadow: 0 0 0 3px rgba(0,163,157,0.2);
  }
  .code-input::placeholder { color: rgba(255,255,255,0.3); }

  .btn-login {
    background: linear-gradient(135deg, #00A39D, #007d78);
    transition: all 0.2s;
  }
  .btn-login:hover { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(0,163,157,0.4); }
  .btn-login:active { transform: translateY(0); }
  .btn-login:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .role-badge {
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }

  .shake { animation: shake 0.4s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  .pulse-dot {
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
</style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

<div class="w-full max-w-md">

  <!-- Header -->
  <div class="text-center mb-8">
    <div class="inline-flex items-center gap-2 mb-6">
      <div class="w-2 h-2 rounded-full bg-bsi-gold pulse-dot"></div>
      <span class="text-xs text-white/50 font-medium tracking-widest uppercase">Branch Banking Simulation</span>
    </div>
    <h1 class="text-3xl font-bold text-white mb-1">BSI Next BM School</h1>
    <p class="text-white/40 text-sm">Scoring System · v2.0</p>
  </div>

  <!-- Card -->
  <div class="glass-card rounded-2xl p-8">

    <div class="mb-6">
      <label class="block text-white/60 text-xs font-semibold tracking-widest uppercase mb-3">
        Kode Akses
      </label>
      <input
        id="codeInput"
        type="password"
        class="code-input w-full px-4 py-3.5 rounded-xl"
        placeholder="BSI2026GM"
        autocomplete="off"
        autocapitalize="characters"
        spellcheck="false"
        maxlength="14"
        oninput="handleInput(this)"
        onkeydown="if(event.key==='Enter') doLogin()"
      >
    </div>

    <!-- Role Preview -->
    <div id="rolePreview" class="hidden mb-5"></div>

    <!-- Error -->
    <div id="errorMsg" class="hidden mb-5 px-4 py-3 rounded-xl bg-red-500/15 border border-red-500/25 text-red-300 text-sm text-center"></div>

    <!-- Login Button -->
    <button
      id="btnLogin"
      onclick="doLogin()"
      disabled
      class="btn-login w-full py-3.5 rounded-xl text-white font-semibold text-base disabled:opacity-40 disabled:cursor-not-allowed"
    >
      Masuk
    </button>

    <!-- Role Map -->
    <div class="mt-6 pt-5 border-t border-white/8">
      <p class="text-white/30 text-xs text-center mb-3 font-medium">Panduan Kode Akses</p>
      <div class="grid grid-cols-2 gap-1.5 text-xs">
        <div class="px-2.5 py-1.5 rounded-lg bg-white/5 text-white/40">BSI2026GM · Game Master</div>
        <div class="px-2.5 py-1.5 rounded-lg bg-white/5 text-white/40">BSI2026LAYAR · Proyektor</div>
        <div class="px-2.5 py-1.5 rounded-lg bg-white/5 text-white/40">BSI2026BOARD · Board</div>
        <div class="px-2.5 py-1.5 rounded-lg bg-white/5 text-white/40">BSI2026REPORT · Laporan</div>
        <div class="px-2.5 py-1.5 rounded-lg bg-white/5 text-white/40">COACH2026G1–G5 · Coach</div>
        <div class="px-2.5 py-1.5 rounded-lg bg-white/5 text-white/40">LEADER2026G1–G5 · Leader</div>
      </div>
    </div>

  </div>

  <p class="text-center text-white/20 text-xs mt-6">
    HCR.ID · BSI Corporate University · 2026
  </p>

</div>

<script src="/constants.js"></script>
<script>
const ROLE_INFO = {
  gm:        { icon:'🎯', label:'Game Master',       color:'#00A39D', desc:'Kontrol sesi & input BPM' },
  projector: { icon:'📺', label:'Layar Proyektor',   color:'#3B82F6', desc:'Display real-time simulasi' },
  board:     { icon:'📊', label:'Board Display',      color:'#8B5CF6', desc:'Leaderboard & agregasi skor' },
  admin:     { icon:'⚙️', label:'Administrator',      color:'#EF4444', desc:'Setup sesi & peserta' },
  report:    { icon:'📋', label:'Laporan & CPI',      color:'#F59E0B', desc:'Rekap nilai & kelulusan' },
  coach:     { icon:'🏅', label:'Coach Kelompok',     color:'#10B981', desc:'Input behavior 6D peserta' },
  leader:    { icon:'👥', label:'Group Leader',       color:'#F8AD3C', desc:'Input BPM perspektif Leader' }
};

function handleInput(el) {
  const val = el.value.toUpperCase();
  el.value = val;
  hideError();

  const match = ACCESS_CODES[val];
  const btn   = document.getElementById('btnLogin');
  const prev  = document.getElementById('rolePreview');

  if (match) {
    const ri = ROLE_INFO[match.role];
    const groupLabel = match.group ? ` · ${GROUPS[match.group].name}` : '';
    prev.innerHTML = `
      <div class="role-badge flex items-center gap-3 px-4 py-3 rounded-xl"
           style="background:${ri.color}20; border:1px solid ${ri.color}40">
        <span class="text-2xl">${ri.icon}</span>
        <div>
          <div class="font-semibold text-white text-sm">${ri.label}${groupLabel}</div>
          <div class="text-xs" style="color:${ri.color}cc">${ri.desc}</div>
        </div>
        <div class="ml-auto w-2 h-2 rounded-full" style="background:${ri.color}"></div>
      </div>`;
    prev.classList.remove('hidden');
    btn.disabled = false;
  } else {
    prev.classList.add('hidden');
    btn.disabled = true;
  }
}

function doLogin() {
  const val   = document.getElementById('codeInput').value.trim().toUpperCase();
  const match = ACCESS_CODES[val];

  if (!match) {
    showError('Kode akses tidak valid. Periksa kembali.');
    document.getElementById('codeInput').classList.add('shake');
    setTimeout(() => document.getElementById('codeInput').classList.remove('shake'), 400);
    return;
  }

  // Save session
  saveSession(match.role, match.group, val);

  // Redirect
  const btn = document.getElementById('btnLogin');
  btn.textContent = 'Mengarahkan...';
  btn.disabled    = true;

  setTimeout(() => { window.location.href = '/' + match.page; }, 300);
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.remove('hidden');
}

function hideError() {
  document.getElementById('errorMsg').classList.add('hidden');
}
</script>
</body>
</html>
